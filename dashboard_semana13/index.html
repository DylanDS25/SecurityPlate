<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecurityPlate | Semana 13</title>
  <style>
    :root { --ink:#e8f7ff; --muted:#91a6b7; --bg:#070b16; --card:#101a2d; --line:#223653; --teal:#55f6d2; --blue:#62b8ff; --gold:#ffd166; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:radial-gradient(circle at 90% 0, #18284d, transparent 30rem), var(--bg); font:15px/1.55 "Segoe UI", sans-serif; }
    main { width:min(1180px, calc(100% - 32px)); margin:40px auto; }
    header { display:flex; justify-content:space-between; gap:20px; align-items:end; margin-bottom:28px; }
    h1 { margin:0; font-family:Consolas, monospace; letter-spacing:-1px; }
    .summary { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:20px; }
    .card, .case { border:1px solid var(--line); border-radius:12px; background:linear-gradient(145deg, rgba(20,32,55,.95), rgba(11,18,33,.95)); box-shadow:0 16px 40px rgba(0,0,0,.24); }
    .card { padding:18px; }
    .card strong { display:block; margin-top:5px; color:var(--teal); font-size:28px; }
    .layout { display:grid; grid-template-columns:320px 1fr; gap:16px; }
    .panel { padding:20px; }
    .panel h2 { margin-top:0; font-size:17px; }
    .rule { margin-bottom:10px; padding:10px; border-left:3px solid var(--teal); background:rgba(85,246,210,.05); }
    .rule b { color:var(--gold); }
    .cases { display:grid; gap:12px; }
    .case { padding:16px; }
    .case-head { display:flex; justify-content:space-between; gap:10px; }
    .status { color:var(--teal); font-weight:bold; }
    .trace { display:grid; gap:5px; margin-top:10px; color:var(--muted); }
    .trace span { padding:5px 8px; border-radius:6px; background:#0a1222; font-family:Consolas, monospace; }
    .empty { color:var(--muted); }
    @media (max-width:800px) {
      header { align-items:start; flex-direction:column; }
      .summary, .layout { grid-template-columns:1fr 1fr; }
      .layout { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p>Inteligencia Artificial / Semana 13</p>
        <h1>Ingenieria del conocimiento</h1>
      </div>
      <code>artifacts/semana13_inferencia.json</code>
    </header>
    <section class="summary" id="summary"></section>
    <section class="layout">
      <aside class="card panel">
        <h2>Base de reglas</h2>
        <div id="rules"><p class="empty">Cargando...</p></div>
      </aside>
      <section>
        <h2>Casos de salida</h2>
        <div class="cases" id="cases"><p class="empty">Cargando evidencia...</p></div>
      </section>
    </section>
  </main>
  <script>
    const summary = document.getElementById("summary");
    const rules = document.getElementById("rules");
    const cases = document.getElementById("cases");

    fetch("/artifacts/semana13_inferencia.json")
      .then(response => {
        if (!response.ok) throw new Error("No se pudo cargar el artefacto JSON.");
        return response.json();
      })
      .then(data => {
        summary.innerHTML = [
          ["Entrada", data.entrada],
          ["Umbral OCR", data.umbrales.confianza_ocr_alta],
          ["Umbral calidad", data.umbrales.imagen_suficiente],
          ["Casos correctos", `${data.resumen.correctos}/${data.resumen.total}`],
        ].map(([label, value]) => `<article class="card">${label}<strong>${value}</strong></article>`).join("");

        rules.innerHTML = data.reglas.map(rule => `
          <article class="rule">
            <b>${rule.nombre}</b><br>
            ${rule.premisas.join(" ∧ ")}<br>
            → ${rule.conclusion}
          </article>`).join("");

        cases.innerHTML = data.casos.map(caso => `
          <article class="case">
            <div class="case-head">
              <div>
                <b>Caso ${caso.id}</b>
                <div>${caso.descripcion}</div>
              </div>
              <span class="status">${caso.estado}</span>
            </div>
            <p><b>Conclusión:</b> ${caso.conclusion_inferida}</p>
            <p><b>Protocolo:</b> ${caso.protocolo} — ${caso.protocolo_aceptado ? "aceptado" : "rechazado"}</p>
            <div class="trace">
              ${caso.trazas.length ? caso.trazas.map(trace => `<span>${trace}</span>`).join("") : "<span>Sin reglas activadas después de las evidencias disponibles.</span>"}
            </div>
          </article>`).join("");
      })
      .catch(error => {
        summary.innerHTML = "";
        rules.innerHTML = `<p class="empty">${error.message}</p>`;
        cases.innerHTML = `<p class="empty">Ejecute: python src/semana13_conocimiento.py --serve</p>`;
      });
  </script>
</body>
</html>
